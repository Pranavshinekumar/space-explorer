<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Holes | Space Explorer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: white;
      font-family: 'Inter', sans-serif;
      background-color: #05070c;
      background-image: url("WhatsApp Image 2026-10-06 at 8.34.20 PM.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .home-frame {
      margin: 40px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 35px;
      position: relative;
      overflow: hidden;
      padding-bottom: 80px;
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, 0.25),
        0 0 40px rgba(0, 0, 0, 0.25);
    }

    /* ---------- Back link ---------- */
    .back {
      position: absolute;
      top: 24px;
      left: 35px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back:hover { color: white; }
    .back:focus-visible,
    .btn:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    /* ---------- Hero ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 0 8%;
    }

    h1 {
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -2px;
      margin: 0 0 20px;
    }

    .hero-description {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 420px;
      margin: 0 0 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 25, 32, 0.55);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      padding: 7px 24px 7px 7px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: 0.3s ease;
    }
    .btn:hover {
      background: rgba(20, 25, 35, 0.7);
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        0 15px 40px rgba(0, 0, 0, 0.55);
    }
    .arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 23px;
      font-weight: 300;
    }

    /* ---------- Content sections ---------- */
    .content { padding: 0 8%; }

    .section {
      padding-top: 80px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin-top: 40px;
    }

    h2 {
      font-size: 35px;
      font-weight: 300;
      letter-spacing: -1px;
      margin: 0 0 14px;
    }

    .lead {
      font-size: 18px;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.78);
      max-width: 620px;
      margin: 0 0 36px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .cards { display: grid; gap: 20px; }
    .cards.three { grid-template-columns: repeat(3, 1fr); }
    .cards.four  { grid-template-columns: repeat(4, 1fr); }

    .space-card {
      background: rgba(5, 8, 15, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      padding: 25px;
      border-radius: 22px;
      text-align: left;
      transition: transform 0.15s ease;
    }
    .space-card h3 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 500;
    }
    .space-card p {
      margin: 0;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.72);
    }
    .space-card .stat {
      display: block;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    .anatomy {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .footer-row {
      margin-top: 80px;
      padding-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-row p {
      margin: 0;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      max-width: 420px;
      line-height: 1.6;
    }
    a.btn { text-decoration: none; }
